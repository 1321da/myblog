services:
  blog:
    build: .
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me-to-a-long-random-string}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - blog-data:/app/data
    restart: unless-stopped

volumes:
  blog-data:
